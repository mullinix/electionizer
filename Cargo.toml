[workspace]
members = [".", "crates/electionizer-core", "crates/electionizer-wasm"]
default-members = [".", "crates/electionizer-core"]
resolver = "2"

[package]
name = "electionizer"
version = "0.1.0"
edition = "2021"
description = "Aggregate election candidate and ballot measure info by ZIP code"
license = "MIT"

[dependencies]
electionizer-core = { path = "crates/electionizer-core" }
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
minijinja = { version = "2", features = ["loader"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio-stream = "0.1.19"
futures-util = "0.3.33"
